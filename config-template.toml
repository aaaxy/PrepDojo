# ============================================================
# PrepDojo configuration
#
# setup.py creates config.toml from this template and fills in the answers
# it asks for. Everything not listed here has a sensible default — the full
# reference, with every setting and its default, is docs/configuration.md.
# Add any of those settings to this file to override them.
#
# After any change: quit Obsidian, run  python3 generate.py , restart Obsidian.
# ============================================================

[vault]
# Absolute path to your Obsidian vault.
# path = "/absolute/path/to/YourVault"

# Where daily notes live, relative to the vault root.
daily_notes_folder = "Calendar/Daily Notes"

# Daily note filename format (must match your Obsidian daily-note setting).
date_format = "YYYY-MM-DD"

# Where the dashboard note goes, relative to the vault root.
dashboard_path = "Interview Prep Dashboard.md"

[leetcode]
# Your LeetCode username. Lets PrepDojo import your recent accepted
# submissions into your log (the dashboard's Import button and
# `prepdojo sync-lc`). Reads public profile data only — no password.
# username = "your-leetcode-username"
